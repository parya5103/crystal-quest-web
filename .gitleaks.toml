# Gitleaks configuration: default rules plus documented, project-specific allowlists.
[extend]
useDefault = true

[[allowlists]]
description = "Client save storage key literal (a localStorage key name, not a credential) in js/ui.js history; keyword proximity (SAVE_KEY/BACKUP_KEY) triggers a generic-api-key false positive."
regexes = [
  '''crystal-quest-save-v1''',
]

[[allowlists]]
description = "Public Firebase web API key of the shared GoGo Firebase project (client-safe by design: a web API key identifies the project, it is not a credential; access is governed by Firebase Security Rules). Shipped in the GoGo Central notifications module and its FCM service worker, matching the public web config already on the GoGo portal."
regexes = [
  '''AIzaSyCtfvrvfRSlZmiNBluRLeHCLNgaNkuY-_4''',
]
