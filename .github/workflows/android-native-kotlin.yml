name: Android Native Kotlin
on:
  pull_request:
    paths: ['android-native/**','.github/workflows/android-native-kotlin.yml']
  push:
    branches: [main]
    paths: ['android-native/**','.github/workflows/android-native-kotlin.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0"
      - name: Test and build
        working-directory: android-native
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-quest-native-apk-aab
          path: |
            android-native/app/build/outputs/apk/debug/*.apk
            android-native/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
