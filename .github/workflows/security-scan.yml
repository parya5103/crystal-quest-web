name: Security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          VERSION='8.30.1'
          curl -sSfL --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --config .gitleaks.toml --report-format json --report-path gitleaks-report.json --exit-code 0 .
          if [ ! -f gitleaks-report.json ]; then
            echo 'gitleaks did not produce a report'; exit 1
          fi
          COUNT=$(jq 'length' gitleaks-report.json)
          echo "gitleaks findings: ${COUNT}"
          if [ "${COUNT}" != "0" ]; then
            jq -r '.[] | "- rule: \(.RuleID) | file: \(.File) | commit: \(.Commit) | line: \(.StartLine) | secret: \(.Secret) | match: \(.Match[0:100])"' gitleaks-report.json | head -30 > findings.txt
            cat findings.txt
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              {
                echo "### Gitleaks findings: ${COUNT} (secrets redacted)"
                echo '```'
                cat findings.txt
                echo '```'
                echo 'If every finding is a documented public-by-design value, extend the .gitleaks.toml allowlists with a justification; otherwise treat as a real leak.'
              } > comment.md
              gh pr comment "$PR_NUMBER" --body-file comment.md
            fi
            exit 1
          fi

  vulns:
    name: Vulnerability scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report vulnerabilities (non-blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '0'
      - name: Gate on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
