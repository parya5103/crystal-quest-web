name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (pinned)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node (pinned)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - name: Run full game regression suite
        run: node tests/game.test.js
      - name: Run SEO metadata and internal-link checks
        run: node tests/seo.test.js
      - name: Run commercial UI regression checks
        run: node tests/commercial-ui.test.js
